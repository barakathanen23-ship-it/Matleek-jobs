<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التوظيف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .hero-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .header-image-container img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #0288d1;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
        }

        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        legend {
            font-weight: bold;
            color: #0288d1;
            padding: 0 10px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group.half {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #34495e;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0288d1;
            box-shadow: 0 0 5px rgba(2, 136, 209, 0.2);
        }

        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px dashed #ccc;
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background: #0288d1;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #01579b;
        }

        .submit-btn:disabled {
            background: #b0bec5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .form-group.half {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-header">
            <span class="badge">انضم إلى فريقنا</span>
            <div class="header-image-container">
                <img src="https://via.placeholder.com/100" alt="صورة الشعار">
            </div>
            <h1>نسعى دائماً لاستقطاب المهارات المميزة!</h1>
            <p class="subtitle">إذا كنت تتمتع بالشغف والرغبة في النمو والنجاح، يسرنا تقديم طلبك للانضمام إلى عائلتنا المهنية.</p>
        </div>

        <form id="jobForm">
            <fieldset>
                <legend>البيانات الشخصية والمعلومات الأساسية</legend>
                <div class="form-row">
                    <div class="form-group half">
                        <label>الاسم الكامل *</label>
                        <input type="text" placeholder="أدخل اسمك الثلاثي أو الرباعي" required>
                    </div>
                    <div class="form-group half">
                        <label>رقم الهاتف *</label>
                        <input type="tel" placeholder="09XX XXX XXX" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>رقم الواتساب</label>
                        <input type="tel" placeholder="إذا كان مختلفاً عن رقم الهاتف">
                    </div>
                    <div class="form-group half">
                        <label>البريد الإلكتروني</label>
                        <input type="email" placeholder="example@email.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>تاريخ الميلاد (أو العمر) *</label>
                        <input type="date" required>
                    </div>
                    <div class="form-group half">
                        <label>مكان الإقامة - المنطقة</label>
                        <input type="text" placeholder="المدينة - المنطقة">
                    </div>
                </div>
                <div class="form-group">
                    <label>المؤهل العلمي *</label>
                    <input type="text" placeholder="مثال: ثانوية عامة، بكالوريوس..." required>
                </div>
            </fieldset>

            <fieldset>
                <legend>تفاصيل الوظيفة والخبرات</legend>
                <div class="form-row">
                    <div class="form-group half">
                        <label>يرجى اختيار الشاغر حسب الخبرة *</label>
                        <select required>
                            <option value="">-- اختر الوظيفة المناسبة --</option>
                            <option value="1">وظيفة 1</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label>عدد سنوات الخبرة في المجال المختار *</label>
                        <input type="number" placeholder="مثال: 2" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>نوع الدوام المفضل *</label>
                        <select required>
                            <option value="">-- اختر --</option>
                            <option value="full">دوام كامل</option>
                            <option value="part">دوام جزئي</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label>آخر مطعم أو شركة عملت بها</label>
                        <input type="text" placeholder="اذكر اسم العمل الأخير">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>القدرة على البدء بالعمل *</label>
                        <select required>
                            <option value="">-- متى يمكنك البدء؟ --</option>
                            <option value="now">فورا</option>
                            <option value="soon">قريباً</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label>الراتب المتوقع (مع ذكر العملة)</label>
                        <input type="text" placeholder="مثال: 3,000,000 ل.س أو 200 دولار">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>المرفقات والملاحظات</legend>
                <div class="form-group">
                    <label>إرفاق السيرة الذاتية (CV)</label>
                    <input type="file" id="cvFile">
                </div>
                <div class="form-group">
                    <label>إرفاق صورة شخصية</label>
                    <input type="file" id="imageFile">
                </div>
                <div class="form-group">
                    <label>ملاحظات (إن وجدت)</label>
                    <textarea rows="3" placeholder="أي معلومات أخرى تود إضافتها . . ."></textarea>
                </div>
            </fieldset>

            <button type="submit" class="submit-btn">إرسال طلب التوظيف 🚀</button>
        </form>
    </div>
</body>
</html>
